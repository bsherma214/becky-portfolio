<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Becky Sherman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #F7F5F1;
    color: #1A1A18;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
  }
  .wrap {
    max-width: 560px;
    text-align: center;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(28px, 5vw, 38px);
    line-height: 1.3;
  }
  p {
    font-size: 15px;
    color: #5B5A54;
    line-height: 1.7;
    margin-top: 16px;
    max-width: 440px;
    margin-left: auto;
    margin-right: auto;
  }
  .status {
    display: inline-block;
    margin-top: 2rem;
    background: #FBF0ED;
    border: 0.5px solid #D9B3A9;
    color: #8C3F30;
    font-size: 12px;
    letter-spacing: 0.03em;
    padding: 8px 16px;
    border-radius: 6px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Global design leader who delivers results, not just design.</h1>
    <p>This is a test deployment confirming the build pipeline works. The real site starts here.</p>
    <div class="status">Deployment test &middot; live</div>
  </div>
</body>
</html>
